# Preview provisional en GitHub Pages (PLAN §4), método por rama `gh-pages`.
# No usa la API de habilitación de Pages (que el token de integración no puede
# invocar); publica el build en la rama `gh-pages` con el GITHUB_TOKEN.
# El deploy final a Hostinger usará `.github/workflows/deploy.yml.disabled`.
name: Deploy preview to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/connect-constanzaacevedo-repo-usunr7
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (sub-directory + noindex preview)
        env:
          SITE_URL: https://ignaciofo-dotcom.github.io
          BASE_PATH: /constanzaacevedo
        run: npm run build
      - name: Disable Jekyll (serve _astro/ assets)
        run: touch dist/.nojekyll
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy preview ${{ github.sha }}"
